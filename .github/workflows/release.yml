name: Release

# Cada push a main compila el APK firmado y publica un release `build-<versionCode>`.
# Las apps instaladas se actualizan solas leyendo ese número (mismo sistema que MTG Reforged).
# Los cambios solo en news.json o en documentación no generan versión: las novedades se leen directo del repo.

on:
  push:
    branches: [main]
    paths-ignore: ["news.json", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el versionCode es la cantidad de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret RELEASE_KEYSTORE_BASE64: las actualizaciones tienen que firmarse siempre con la misma clave."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
          apk=$(ls dist/gappribaldi-v*.apk | head -1)
          echo "APK=$apk" >> "$GITHUB_ENV"
          label=$(basename "$apk" .apk); echo "LABEL=${label#gappribaldi-}" >> "$GITHUB_ENV"
          echo "CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$CODE" "$APK" \
            --target "${{ github.sha }}" \
            --title "Gappribaldi $LABEL" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
